<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra Galaxia Red Velvet</title>
    <style>
        /* --- ESTILOS (CSS) --- */
        /* Aquí definimos los colores Red Velvet y la fuente */
        body {
            margin: 0;
            overflow: hidden; /* Evita que la página tenga barras de desplazamiento */
            background: radial-gradient(circle at center, #8a1c31 0%, #3d000a 100%); /* Color Red Velvet */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            text-align: center;
        }

        h1 {
            margin-top: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }

        /* Contenedor de la galaxia */
        .galaxia {
            position: relative;
            width: 100vw;
            height: 80vh;
        }

        /* Estilo base para los planetas */
        .planeta {
            position: absolute;
            border-radius: 50%;
            cursor: pointer; /* Cambia el cursor a una manito al pasar sobre ellos */
            box-shadow: 0 0 20px rgba(255, 105, 135, 0.6); /* Brillo tierno */
            transition: transform 0.3s ease; /* Efecto suave al pasar el mouse */
        }

        /* Efecto de crecimiento al pasar el mouse sobre un planeta */
        .planeta:hover {
            transform: scale(1.2);
        }

        /* Ubicación y color del Planeta 1 */
        #planeta1 {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            top: 20%; left: 20%;
        }

        /* Ubicación y color del Planeta 2 */
        #planeta2 {
            width: 100px; height: 100px;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            top: 50%; left: 60%;
        }

        /* Ubicación y color del Planeta 3 */
        #planeta3 {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, #f77062 0%, #fe5196 100%);
            top: 70%; left: 30%;
        }

        /* Estilos de la ventana emergente (Modal) */
        .modal {
            display: none; /* Oculto por defecto */
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background-color: #fff0f3; /* Un rosa muy clarito y tierno */
            color: #590d22;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            z-index: 100;
            width: 300px;
            text-align: center;
        }

        /* Fondo oscuro al abrir la ventana emergente */
        .fondo-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6);
            z-index: 90;
        }

        /* Estilo de la imagen de Snoopy */
        .modal img {
            width: 150px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        /* Estilo del botón de cerrar */
        .btn-cerrar {
            background-color: #c9184a;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 10px;
        }
        
        .btn-cerrar:hover {
            background-color: #ff4d6d;
        }
    </style>
</head>
<body>

    <!-- --- ESTRUCTURA (HTML) --- -->
    <h1>Para mi Universo... 💖</h1>

    <div class="galaxia">
        <!-- Estos son los planetas. El 'onclick' le dice qué función de JS usar al dar clic -->
        <div id="planeta1" class="planeta" onclick="abrirMensaje(0)"></div>
        <div id="planeta2" class="planeta" onclick="abrirMensaje(1)"></div>
        <div id="planeta3" class="planeta" onclick="abrirMensaje(2)"></div>
    </div>

    <!-- El fondo oscuro y la ventana emergente que se mostrarán al hacer clic -->
    <div id="fondoModal" class="fondo-modal" onclick="cerrarMensaje()"></div>
    <div id="ventanaModal" class="modal">
        <img id="imagenSnoopy" src="" alt="Snoopy tierno">
        <h2 id="tituloMensaje"></h2>
        <p id="textoMensaje"></p>
        <button class="btn-cerrar" onclick="cerrarMensaje()">Cerrar</button>
    </div>

    <!-- --- INTERACTIVIDAD (JAVASCRIPT) --- -->
    <script>
        // Aquí guardamos los datos de cada planeta (Títulos, Mensajes y URLs de las imágenes)
        const datosPlanetas = [
            {
                titulo: "Planeta del Amor",
                mensaje: "Eres lo mejor que me ha pasado. ¡Te quiero muchísimo!",
                imagen: "https://i.pinimg.com/originals/c9/79/11/c97911fa44754a6db24ce9bd9bc8e8bb.png"
            },
            {
                titulo: "Planeta de la Ternura",
                mensaje: "Cada momento a tu lado es tan especial como las estrellas de esta galaxia.",
                imagen: "https://i.pinimg.com/originals/16/06/10/160610f639c0993d0f04c7cffbd7c20c.png"
            },
            {
                titulo: "Planeta de la Felicidad",
                mensaje: "Mi lugar favorito en todo el universo es siempre junto a ti.",
                imagen: "https://i.pinimg.com/originals/99/bd/69/99bd699f0bf5716df63d5ff64b150997.png"
            }
        ];

        // Función para abrir la ventana emergente con el mensaje correcto
        function abrirMensaje(indice) {
            // Buscamos los elementos en el HTML para cambiarles el contenido
            document.getElementById('tituloMensaje').innerText = datosPlanetas[indice].titulo;
            document.getElementById('textoMensaje').innerText = datosPlanetas[indice].mensaje;
            document.getElementById('imagenSnoopy').src = datosPlanetas[indice].imagen;

            // Mostramos la ventana y el fondo oscuro
            document.getElementById('ventanaModal').style.display = 'block';
            document.getElementById('fondoModal').style.display = 'block';
        }

        // Función para cerrar la ventana emergente
        function cerrarMensaje() {
            document.getElementById('ventanaModal').style.display = 'none';
            document.getElementById('fondoModal').style.display = 'none';
        }
    </script>
</body>
</html>
