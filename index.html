<!DOCTYPE html>  
<html lang="es">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Para Ti ❤️.html</title>  
    <!-- Importamos la librería Three.js para gráficos 3D reales -->  
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>  
    <style>  
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Fira+Code:wght@400;500&display=swap');  
  
        * { margin: 0; padding: 0; box-sizing: border-box; }  
  
        body {  
            background-color: #05000a;  
            color: #fff;  
            font-family: 'Poppins', sans-serif;  
            overflow: hidden;  
            width: 100vw;  
            height: 100vh;  
        }  
  
        /* Contenedor del canvas 3D */  
        #webgl-container {  
            position: absolute;  
            top: 0;  
            left: 0;  
            width: 100%;  
            height: 100%;  
            z-index: 1;  
        }  
  
        /* Interfaz de usuario flotante */  
        .ui-layer {  
            position: relative;  
            z-index: 2;  
            display: flex;  
            flex-direction: column;  
            justify-content: space-between;  
            align-items: center;  
            height: 100%;  
            padding: 5vh 20px;  
            pointer-events: none; /* Deja pasar el click al 3D */  
        }  
  
        .header {  
            text-align: center;  
            animation: fadeInDown 2s ease-out forwards;  
        }  
  
        .title {  
            font-size: clamp(2.5rem, 5vw, 4rem);  
            font-weight: 800;  
            background: linear-gradient(to right, #ff758c 0%, #ff7eb3 100%);  
            -webkit-background-clip: text;  
            -webkit-text-fill-color: transparent;  
            text-shadow: 0 0 30px rgba(255, 117, 140, 0.3);  
        }  
  
        .subtitle {  
            font-size: 1.2rem;  
            color: #ffb3c6;  
            letter-spacing: 4px;  
            text-transform: uppercase;  
            margin-top: 5px;  
            text-shadow: 0 0 10px rgba(255,179,198, 0.5);  
        }  
  
        /* Editor de código estilo Mac */  
        .editor {  
            background: rgba(13, 17, 23, 0.85);  
            backdrop-filter: blur(10px);  
            border: 1px solid rgba(255, 255, 255, 0.1);  
            border-radius: 16px;  
            width: 100%;  
            max-width: 420px;  
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), 0 0 40px rgba(255, 75, 129, 0.2);  
            pointer-events: auto; /* Reactiva el mouse para el editor */  
            transform: translateY(50px);  
            opacity: 0;  
            animation: fadeInUp 2s 1s ease-out forwards, floatBlock 6s ease-in-out infinite alternate;  
        }  
  
        .editor-header {  
            background: rgba(22, 27, 34, 0.9);  
            padding: 15px;  
            display: flex;  
            align-items: center;  
            border-bottom: 1px solid rgba(255,255,255,0.05);  
            border-top-left-radius: 16px;  
            border-top-right-radius: 16px;  
            position: relative;  
        }  
  
        .dots { display: flex; gap: 8px; position: absolute; }  
        .dot { width: 12px; height: 12px; border-radius: 50%; }  
        .dot.red { background-color: #ff5f56; box-shadow: 0 0 10px #ff5f56; }  
        .dot.yellow { background-color: #ffbd2e; box-shadow: 0 0 10px #ffbd2e;}  
        .dot.green { background-color: #27c93f; box-shadow: 0 0 10px #27c93f;}  
  
        .editor-title {  
            width: 100%;  
            text-align: center;  
            color: #8b949e;  
            font-size: 0.9rem;  
            font-family: 'Fira Code', monospace;  
            letter-spacing: 1px;  
        }  
  
        .editor-content {  
            padding: 25px;  
            font-family: 'Fira Code', monospace;  
            font-size: 1rem;  
            line-height: 1.7;  
        }  
  
        .line { display: flex; }  
        .line-num { color: #484f58; width: 35px; user-select: none; }  
        .code { color: #c9d1d9; }  
        .selector { color: #ff7b72; text-shadow: 0 0 5px rgba(255,123,114,0.4); }  
        .property { color: #79c0ff; }  
        .value { color: #a5d6ff; }  
        .string { color: #a5d6ff; }  
        .variable { color: #ffa657; }  
  
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-50px); } to { opacity: 1; transform: translateY(0); } }  
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } }  
        @keyframes floatBlock { 0% { transform: translateY(0px); } 100% { transform: translateY(-15px); } }  
    </style>  
</head>  
<body>  
  
    <!-- Escenario 3D -->  
    <div id="webgl-container"></div>  
  
    <!-- Interfaz frontal -->  
    <div class="ui-layer">  
        <div class="header">  
            <h1 class="title">Feliz Día de la Novia</h1>  
            <p class="subtitle">Para el amor de mi vida</p>  
        </div>  
  
        <div class="editor">  
            <div class="editor-header">  
                <div class="dots">  
                    <span class="dot red"></span>  
                    <span class="dot yellow"></span>  
                    <span class="dot green"></span>  
                </div>  
                <div class="editor-title">Style.css</div>  
            </div>  
            <div class="editor-content">  
                <div class="line"><span class="line-num">1</span><span class="code"><span class="selector">.My_Girlfriend</span> {</span></div>  
                <div class="line"><span class="line-num">2</span><span class="code">  <span class="property">position</span>: <span class="value">absolute</span>;</span></div>  
                <div class="line"><span class="line-num">3</span><span class="code">  <span class="property">width</span>: <span class="value">90%</span>;</span></div>  
                <div class="line"><span class="line-num">4</span><span class="code">  <span class="property">font-size</span>: <span class="value">2rem</span>;</span></div>  
                <div class="line"><span class="line-num">5</span><span class="code">  <span class="property">font-family</span>: <span class="string">"Te Amo"</span>;</span></div>  
                <div class="line"><span class="line-num">6</span><span class="code">  <span class="property">height</span>: <span class="variable">var(--letter-love)</span>;</span></div>  
                <div class="line"><span class="line-num">7</span><span class="code">  <span class="property">transform</span>: <span class="value">translateX(-50%)</span>;</span></div>  
                <div class="line"><span class="line-num">8</span><span class="code">  <span class="property">background</span>: <span class="variable">var(--letter)</span>;</span></div>  
                <div class="line"><span class="line-num">9</span><span class="code">}</span></div>  
            </div>  
        </div>  
    </div>  
  
    <!-- Script de Magia 3D -->  
    <script>  
        // 1. Configuración Básica de Three.js  
        const container = document.getElementById('webgl-container');  
        const scene = new THREE.Scene();  
        // Neblina espacial para dar profundidad  
        scene.fog = new THREE.FogExp2(0x05000a, 0.002);  
  
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);  
        camera.position.z = 50; // Posición de la cámara  
  
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });  
        renderer.setSize(window.innerWidth, window.innerHeight);  
        renderer.setPixelRatio(window.devicePixelRatio);  
        container.appendChild(renderer.domElement);  
  
        // 2. Creación del Corazón 3D de Partículas  
        const heartCount = 4000;  
        const heartGeometry = new THREE.BufferGeometry();  
        const heartPositions = new Float32Array(heartCount * 3);  
        const heartColors = new Float32Array(heartCount * 3);  
        const color = new THREE.Color();  
  
        for (let i = 0; i < heartCount; i++) {  
            // Ecuación paramétrica de un corazón  
            const t = Math.random() * Math.PI * 2;  
            // Añadir volumen 3D aleatorio  
            const r = Math.random() * 2;   
  
            // Matemáticas del corazón (escalado)  
            let x = 16 * Math.pow(Math.sin(t), 3);  
            let y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);  
            let z = (Math.random() - 0.5) * 10; // Grosor 3D  
  
            // Dispersión sutil  
            x = x + (Math.random() - 0.5) * r;  
            y = y + (Math.random() - 0.5) * r;  
  
            heartPositions[i * 3] = x;  
            heartPositions[i * 3 + 1] = y;  
            heartPositions[i * 3 + 2] = z;  
  
            // Colores: Tonos de rosa intenso y rojo brillante  
            color.setHSL(0.95 + Math.random() * 0.05, 1.0, 0.5 + Math.random() * 0.3);  
            heartColors[i * 3] = color.r;  
            heartColors[i * 3 + 1] = color.g;  
            heartColors[i * 3 + 2] = color.b;  
        }  
  
        heartGeometry.setAttribute('position', new THREE.BufferAttribute(heartPositions, 3));  
        heartGeometry.setAttribute('color', new THREE.BufferAttribute(heartColors, 3));  
  
        // Material mágico: Brillante y aditivo  
        const heartMaterial = new THREE.PointsMaterial({  
            size: 0.4,  
            vertexColors: true,  
            blending: THREE.AdditiveBlending,  
            transparent: true,  
            opacity: 0.8,  
            depthWrite: false  
        });  
  
        const heart = new THREE.Points(heartGeometry, heartMaterial);  
          
        // Ajustar posición del corazón detrás del código  
        heart.position.y = 5;   
        scene.add(heart);  
  
        // 3. Galaxia de fondo (Estrellas flotantes)  
        const starsCount = 3000;  
        const starsGeometry = new THREE.BufferGeometry();  
        const starsPositions = new Float32Array(starsCount * 3);  
  
        for(let i=0; i<starsCount; i++) {  
            starsPositions[i*3] = (Math.random() - 0.5) * 200;  
            starsPositions[i*3+1] = (Math.random() - 0.5) * 200;  
            starsPositions[i*3+2] = (Math.random() - 0.5) * 200 - 50; // Detrás  
        }  
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starsPositions, 3));  
          
        const starsMaterial = new THREE.PointsMaterial({  
            color: 0xffb3c6,  
            size: 0.2,  
            transparent: true,  
            opacity: 0.6,  
            blending: THREE.AdditiveBlending  
        });  
        const starField = new THREE.Points(starsGeometry, starsMaterial);  
        scene.add(starField);  
  
        // 4. Interactividad con el Ratón (Parallax effect)  
        let mouseX = 0;  
        let mouseY = 0;  
        let targetX = 0;  
        let targetY = 0;  
        const windowHalfX = window.innerWidth / 2;  
        const windowHalfY = window.innerHeight / 2;  
  
        document.addEventListener('mousemove', (event) => {  
            mouseX = (event.clientX - windowHalfX);  
            mouseY = (event.clientY - windowHalfY);  
        });  
  
        // 5. Bucle de Animación  
        let time = 0;  
        function animate() {  
            requestAnimationFrame(animate);  
            time += 0.005;  
  
            // Movimiento suave del ratón (Easing)  
            targetX = mouseX * 0.001;  
            targetY = mouseY * 0.001;  
  
            // Rotar corazón suavemente y aplicar efecto parallax  
            heart.rotation.y += 0.005;  
            heart.rotation.x = Math.sin(time) * 0.1;   
              
            // Movimiento de cámara basado en el ratón  
            camera.position.x += (mouseX * 0.01 - camera.position.x) * 0.05;  
            camera.position.y += (-mouseY * 0.01 - camera.position.y) * 0.05;  
            camera.lookAt(scene.position);  
  
            // Rotación suave del universo  
            starField.rotation.y -= 0.001;  
            starField.rotation.x -= 0.0005;  
  
            // Hacer palpitar el corazón modificando su escala  
            const pulse = 1 + Math.sin(time * 10) * 0.05;  
            heart.scale.set(pulse, pulse, pulse);  
  
            renderer.render(scene, camera);  
        }  
  
        // Ajustar al redimensionar ventana  
        window.addEventListener('resize', () => {  
            camera.aspect = window.innerWidth / window.innerHeight;  
            camera.updateProjectionMatrix();  
            renderer.setSize(window.innerWidth, window.innerHeight);  
        });  
  
        animate(); // Iniciar la magia  
    </script>  
</body>  
</html>
