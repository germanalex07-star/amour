<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensaje Especial</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: white;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .pantalla {
            position: absolute;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 100%;
            height: 100%;
            transition: opacity 0.4s ease;
            padding: 0 20px;
            box-sizing: border-box;
        }

        #fase1 {
            opacity: 1;
        }

        #fase1 p {
            font-size: 1.8rem;
            font-weight: bold;
        }

        #fase2 {
            display: none; 
            opacity: 0;
        }

        #fase2 p {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ff0055;
            margin-top: 20px;
        }

        .celular-css {
            width: 45px;
            height: 85px;
            border: 3px solid white;
            border-radius: 8px;
            position: relative;
            animation: girarCelular 2s ease-in-out infinite;
        }

        .celular-css::before {
            content: '';
            position: absolute;
            top: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 3px;
            background-color: white;
            border-radius: 2px;
        }

        @keyframes girarCelular {
            0%, 20% { transform: rotate(0deg); }
            80%, 100% { transform: rotate(90deg); }
        }

        #fase3 {
            display: none; 
            opacity: 0;
            transform: rotate(90deg);
            width: 100vh; 
            height: 100vw;
        }

        .led-text {
            font-family: 'DotGothic16', sans-serif;
            font-size: 15vh; 
            color: #ff0055;
            text-shadow: 0 0 5px #ff0055, 0 0 10px #7a0029;
            white-space: nowrap;
            animation: scrollText 22s linear infinite;
        }

        @keyframes scrollText {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-150%); }
        }
    </style>
</head>
<body>

    <div id="fase1" class="pantalla">
        <p>Sé que han sido unos meses difíciles, pero...</p>
    </div>

    <div id="fase2" class="pantalla">
        <div class="celular-css"></div>
        <p>Gira tu celular</p>
    </div>

    <div id="fase3" class="pantalla">
        <div class="led-text">
            ❤️ Pasaba por aquí para Recordarte que eres una gran persona y que vas a cumplir todos tus sueños y metas. Te quiero mucho 🥰
        </div>
    </div>

    <script>
        const fase1 = document.getElementById('fase1');
        const fase2 = document.getElementById('fase2');
        const fase3 = document.getElementById('fase3');

        setTimeout(() => {
            fase1.style.opacity = '0';
            setTimeout(() => {
                fase1.style.display = 'none';
                fase2.style.display = 'flex';
                setTimeout(() => { fase2.style.opacity = '1'; }, 50);
                
                setTimeout(() => {
                    fase2.style.opacity = '0';
                    setTimeout(() => {
                        fase2.style.display = 'none';
                        
                        setTimeout(() => {
                            fase3.style.display = 'flex';
                            setTimeout(() => { fase3.style.opacity = '1'; }, 50);
                        }, 2000); 
                        
                    }, 400); 
                }, 2500); 
            }, 400); 
        }, 2500); 
    </script>

</body>
</html>
