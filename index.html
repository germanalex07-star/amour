<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>( para mi Casi todo ) 💖</title>
    <style>
        /* --- ESTILOS (CSS) --- */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            /* Fondo de la galaxia en tonos Red Velvet y azul profundo */
            background-color: #0d0a1b;
            background-image:
                radial-gradient(circle at 40% 50%, rgba(255, 0, 128, 0.4) 0%, rgba(255, 0, 128, 0) 60%),
                radial-gradient(circle at 60% 50%, rgba(0, 128, 255, 0.3) 0%, rgba(0, 128, 255, 0) 70%),
                radial-gradient(circle at 50% 40%, rgba(255, 80, 0, 0.2) 0%, rgba(255, 80, 0, 0) 50%),
                radial-gradient(circle at 50% 60%, rgba(255, 0, 255, 0.2) 0%, rgba(255, 0, 255, 0) 50%);
            background-size: cover;
            font-family: 'Poppins', sans-serif; /* Tipografía tierna y moderna */
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Evitar barras de desplazamiento */
        }

        /* -- Pantalla de Inicio -- */
        #landing-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            text-align: center;
        }

        h1 {
            font-size: 3em;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        /* Estilo del corazón CSS */
        .heart-button {
            width: 150px;
            height: 150px;
            background-color: #ff1493; /* Rosa fucsia */
            position: relative;
            transform: rotate(-45deg);
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 20, 147, 0.8);
            animation: heart-beat 1.5s infinite; /* Animación de latido */
            margin-top: 50px;
        }

        .heart-button::before,
        .heart-button::after {
            content: '';
            width: 150px;
            height: 150px;
            background-color: #ff1493;
            border-radius: 50%;
            position: absolute;
        }

        .heart-button::before { top: -75px; left: 0; }
        .heart-button::after { left: 75px; top: 0; }

        @keyframes heart-beat {
            0%, 100% { transform: scale(1) rotate(-45deg); }
            50% { transform: scale(1.1) rotate(-45deg); }
        }

        /* -- Pantalla de la Galaxia -- */
        #galaxy-container {
            display: none; /* Oculto por defecto */
            position: relative;
            width: 100vw;
            height: 100vh;
            z-index: 5;
            animation: fade-in 2s ease-out; /* Animación de entrada */
        }

        /* Capa para el efecto de nebulosa en forma de corazón */
        #heart-nebula {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 80%;
            background-image:
                radial-gradient(circle, rgba(255, 20, 147, 0.6) 0%, rgba(255, 20, 147, 0) 70%),
                radial-gradient(circle, rgba(255, 105, 180, 0.4) 0%, rgba(255, 105, 180, 0) 80%);
            clip-path: polygon(50% 0%, 100% 35%, 82% 100%, 50% 80%, 18% 100%, 0% 35%); /* Forma aproximada de corazón */
            filter: blur(15px); /* Desenfocar para un efecto de nebulosa suave */
            z-index: 1;
            opacity: 0.8;
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Estilo base de los planetas */
        .planet {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
            transition: transform 0.3s ease;
            animation: sparkle 2s infinite;
        }

        .planet:hover {
            transform: scale(1.3);
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0.8; box-shadow: 0 0 15px rgba(255, 255, 255, 0.8); }
            50% { opacity: 1; box-shadow: 0 0 20px rgba(255, 255, 255, 1); }
        }

        /* -- Ventana Modal de Mensajes -- */
        .modal {
            display: none; /* Oculta por defecto */
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 400px;
            background-color: #fff;
            border-radius: 20px;
            padding: 30px;
            z-index: 100;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            color: #333;
        }

        .modal-content img {
            max-width: 100%;
            height: auto;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        .modal-content p {
            font-size: 1.2em;
            margin: 0;
            color: #555;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 2em;
            cursor: pointer;
            color: #ff1493;
        }

        #modal-overlay {
            display: none; /* Oculta por defecto */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            z-index: 90;
        }
    </style>
</head>
<body>

    <!-- --- ESTRUCTURA (HTML) --- -->
    
    <!-- Pantalla de Inicio con el título y el corazón -->
    <div id="landing-screen">
        <h1>( para mi Casi todo )</h1>
        <p>Toca el corazón para explorar nuestra galaxia</p>
        <div class="heart-button" onclick="startGame()"></div>
    </div>

    <!-- Pantalla de la Galaxia (vacía al principio, se llena con JavaScript) -->
    <div id="galaxy-container">
        <div id="heart-nebula"></div>
        <div id="planets-layer"></div>
    </div>

    <!-- Ventana Modal para los mensajes -->
    <div id="modal-overlay"></div>
    <div id="modal" class="modal">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <div class="modal-content">
            <img id="snoopy-image" src="" alt="Escena de Snoopy">
            <p id="love-message"></p>
        </div>
    </div>

    <!-- --- INTERACTIVIDAD (JAVASCRIPT) --- -->
    <script>
        // Array de datos de los 15 planetas con mensajes y descripciones de imágenes de Snoopy
        const dataPlanetas = [
            { id: 1, mensaje: "A tu lado soy mi mejor versión", imagen: "snoopy-hugging-woodstock.png", desc: "Snoopy abrazando a Woodstock" },
            { id: 2, mensaje: "Contigo todo es más bello", imagen: "snoopy-woodstock-dancing.png", desc: "Snoopy y Woodstock bailando" },
            { id: 3, mensaje: "Eres el sol de mi universo", imagen: "snoopy-lying-on-roof.png", desc: "Snoopy durmiendo bajo el sol" },
            { id: 4, mensaje: "No hay galaxia más linda que tu sonrisa", imagen: "snoopy-grinning.png", desc: "Snoopy sonriendo" },
            { id: 5, mensaje: "Mi corazón orbita alrededor del tuyo", imagen: "snoopy-with-heart-balloon.png", desc: "Snoopy con un globo de corazón" },
            { id: 6, mensaje: "Juntos somos la constelación perfecta", imagen: "snoopy-woodstock-reading.png", desc: "Snoopy leyendo con Woodstock" },
            { id: 7, mensaje: "Eres el descubrimiento más hermoso", imagen: "snoopy-peeking-out.png", desc: "Snoopy asomándose" },
            { id: 8, mensaje: "Cada día te quiero más que a todas las estrellas", imagen: "snoopy-looking-at-stars.png", desc: "Snoopy mirando a las estrellas" },
            { id: 9, mensaje: "Mi viaje espacial favorito es estar contigo", imagen: "snoopy-flying-ace.png", desc: "Snoopy como el Barón Rojo (más tierno, con un corazón)" },
            { id: 10, mensaje: "Iluminas mi mundo como una supernova", imagen: "snoopy-holding-woodstock.png", desc: "Snoopy sosteniendo a Woodstock" },
            { id: 11, mensaje: "Con tigo la vida es una dulce aventura", imagen: "snoopy-eating-donut.png", desc: "Snoopy comiendo una rosquilla" },
            { id: 12, mensaje: "Mi deseo a una estrella fugaz eres tú", imagen: "snoopy-and-woodstock-on-swing.png", desc: "Snoopy y Woodstock en un columpio" },
            { id: 13, mensaje: "Eres la gravedad que me mantiene feliz", imagen: "snoopy-smiling-at-woodstock.png", desc: "Snoopy sonriéndole a Woodstock" },
            { id: 14, mensaje: "Nuestro amor es infinito como el espacio", imagen: "snoopy-hugging-his-doghouse.png", desc: "Snoopy abrazando su caseta" },
            { id: 15, mensaje: "Simplemente, eres mi todo", imagen: "snoopy-kissing-woodstock.png", desc: "Snoopy dándole un beso a Woodstock" }
        ];

        // Función para cambiar de la pantalla de inicio a la galaxia
        function startGame() {
            document.getElementById('landing-screen').style.display = 'none';
            document.getElementById('galaxy-container').style.display = 'block';
            generatePlanets(); // Crear los planetas al cargar la galaxia
        }

        // Función para generar los planetas dinámicamente
        function generatePlanets() {
            const planetsLayer = document.getElementById('planets-layer');
            const numPlanets = dataPlanetas.length;

            // Diferentes gradientes tiernos para los planetas
            const planetGradients = [
                'radial-gradient(circle at 30% 30%, #ff69b4 0%, #ff1493 80%)', /* Rosa */
                'radial-gradient(circle at 30% 30%, #1e90ff 0%, #0000ff 80%)', /* Azul */
                'radial-gradient(circle at 30% 30%, #ff4500 0%, #ff0000 80%)', /* Rojo */
                'radial-gradient(circle at 30% 30%, #ff1493 0%, #ff69b4 80%)', /* Fucsia */
                'radial-gradient(circle at 30% 30%, #00bfff 0%, #1e90ff 80%)'  /* Azul claro */
            ];

            for (let i = 0; i < numPlanets; i++) {
                const planet = document.createElement('div');
                planet.classList.add('planet');
                
                // Posicionamiento aleatorio en la pantalla, dentro de márgenes
                planet.style.top = (Math.random() * 80 + 10) + '%';
                planet.style.left = (Math.random() * 80 + 10) + '%';
                
                // Tamaño ligeramente variado
                const size = Math.random() * 10 + 25 + 'px';
                planet.style.width = size;
                planet.style.height = size;

                // Color aleatorio
                planet.style.background = planetGradients[Math.floor(Math.random() * planetGradients.length)];
                
                // Guardar los datos del planeta en el elemento HTML
                planet.dataset.id = dataPlanetas[i].id;
                
                // Añadir evento de clic
                planet.onclick = function() {
                    openModal(this.dataset.id);
                };

                planetsLayer.appendChild(planet);
            }
        }

        // Funciones para manejar la ventana modal
        function openModal(planetId) {
            // Encontrar los datos del planeta correcto
            const planetData = dataPlanetas.find(p => p.id == planetId);
            if (planetData) {
                // Actualizar el contenido del modal
                document.getElementById('snoopy-image').src = planetData.imagen;
                document.getElementById('snoopy-image').alt = planetData.desc;
                document.getElementById('love-message').textContent = planetData.mensaje;

                // Mostrar el modal y el fondo oscuro
                document.getElementById('modal').style.display = 'block';
                document.getElementById('modal-overlay').style.display = 'block';
            }
        }

        function closeModal() {
            // Ocultar el modal y el fondo oscuro
            document.getElementById('modal').style.display = 'none';
            document.getElementById('modal-overlay').style.display = 'none';
        }
    </script>
</body>
</html>
