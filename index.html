<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ti ❤️</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #030005;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Capa de texto elegante flotando sobre la galaxia */
        .ui-layer {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100%;
            padding: 8vh 20px;
            pointer-events: none;
        }

        .header {
            text-align: center;
            animation: fadeInDown 2s ease-out forwards;
        }

        .title {
            font-size: clamp(2.2rem, 6vw, 4.5rem);
            font-weight: 800;
            background: linear-gradient(to right, #ff416c, #ff4b2b, #ff758c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(255, 65, 108, 0.5);
            line-height: 1.2;
        }

        .subtitle {
            font-size: clamp(1rem, 3vw, 1.4rem);
            color: #ffb3c6;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-top: 10px;
            font-weight: 600;
            text-shadow: 0 0 15px rgba(255, 179, 198, 0.7);
        }

        .footer-note {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 2px;
            animation: fadeInUp 2s 1s ease-out forwards;
            opacity: 0;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="webgl-container"></div>

    <div class="ui-layer">
        <div class="header">
            <h1 class="title">Feliz Día de la Novia</h1>
            <p class="subtitle">Mi amor eterno</p>
        </div>
        <div class="footer-note">Te amo con todo mi corazón</div>
    </div>

    <script>
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030005, 0.002);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 45;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Corazón 3D masivo de partículas
        const heartCount = 6000;
        const heartGeometry = new THREE.BufferGeometry();
        const heartPositions = new Float32Array(heartCount * 3);
        const heartColors = new Float32Array(heartCount * 3);
        const color = new THREE.Color();

        for (let i = 0; i < heartCount; i++) {
            const t = Math.random() * Math.PI * 2;
            const r = Math.random() * 2.5;

            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
            let z = (Math.random() - 0.5) * 14;

            x += (Math.random() - 0.5) * r;
            y += (Math.random() - 0.5) * r;

            heartPositions[i * 3] = x;
            heartPositions[i * 3 + 1] = y;
            heartPositions[i * 3 + 2] = z;

            color.setHSL(0.96 + Math.random() * 0.04, 1.0, 0.6 + Math.random() * 0.3);
            heartColors[i * 3] = color.r;
            heartColors[i * 3 + 1] = color.g;
            heartColors[i * 3 + 2] = color.b;
        }

        heartGeometry.setAttribute('position', new THREE.BufferAttribute(heartPositions, 3));
        heartGeometry.setAttribute('color', new THREE.BufferAttribute(heartColors, 3));

        const heartMaterial = new THREE.PointsMaterial({
            size: 0.45,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity: 0.9,
            depthWrite: false
        });

        const heart = new THREE.Points(heartGeometry, heartMaterial);
        heart.position.y = 1;
        scene.add(heart);

        // Galaxia de fondo (Estrellas envolventes)
        const starsCount = 4000;
        const starsGeometry = new THREE.BufferGeometry();
        const starsPositions = new Float32Array(starsCount * 3);

        for(let i = 0; i < starsCount; i++) {
            starsPositions[i * 3] = (Math.random() - 0.5) * 300;
            starsPositions[i * 3 + 1] = (Math.random() - 0.5) * 300;
            starsPositions[i * 3 + 2] = (Math.random() - 0.5) * 300;
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starsPositions, 3));
        
        const starsMaterial = new THREE.PointsMaterial({
            color: 0xffb3c6,
            size: 0.25,
            transparent: true,
            opacity: 0.7,
            blending: THREE.AdditiveBlending
        });
        const starField = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(starField);

        let mouseX = 0, mouseY = 0;
        const windowHalfX = window.innerWidth / 2;
        const windowHalfY = window.innerHeight / 2;

        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX - windowHalfX);
            mouseY = (event.clientY - windowHalfY);
        });

        // Soporte táctil para el celular
        document.addEventListener('touchmove', (event) => {
            if (event.touches.length > 0) {
                mouseX = (event.touches[0].clientX - windowHalfX);
                mouseY = (event.touches[0].clientY - windowHalfY);
            }
        });

        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.008;

            heart.rotation.y += 0.006;
            heart.rotation.x = Math.sin(time) * 0.12;

            camera.position.x += (mouseX * 0.015 - camera.position.x) * 0.05;
            camera.position.y += (-mouseY * 0.015 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            starField.rotation.y -= 0.0012;

            // Latido rítmico del corazón
            const pulse = 1 + Math.sin(time * 12) * 0.06;
            heart.scale.set(pulse, pulse, pulse);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
