<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxia de 100 Elementos</title>
    <style>
        /* --- ESTILOS (CSS) --- */
        body {
            margin: 0; padding: 0; min-height: 100vh;
            background-color: #0d0a1b;
            background-image:
                radial-gradient(circle at 40% 50%, rgba(255, 0, 128, 0.4) 0%, rgba(255, 0, 128, 0) 60%),
                radial-gradient(circle at 60% 50%, rgba(0, 128, 255, 0.3) 0%, rgba(0, 128, 255, 0) 70%),
                radial-gradient(circle at 50% 40%, rgba(255, 80, 0, 0.2) 0%, rgba(255, 80, 0, 0) 50%);
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff; display: flex; justify-content: center;
            align-items: center; overflow: hidden; 
        }

        #landing-screen {
            position: absolute; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 10; text-align: center;
        }

        #galaxy-container {
            display: none; position: relative;
            width: 100vw; height: 100vh;
            z-index: 5; animation: fade-in 2s ease-out;
        }

        h1 { font-size: 3em; text-shadow: 2px 2px 5px rgba(0,0,0,0.5); margin-bottom: 20px; }

        .heart-button {
            width: 120px; height: 120px; background-color: #ff1493;
            position: relative; transform: rotate(-45deg); cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 20, 147, 0.8);
            animation: heart-beat 1.5s infinite; margin-top: 50px;
        }
        .heart-button::before, .heart-button::after {
            content: ''; width: 120px; height: 120px;
            background-color: #ff1493; border-radius: 50%; position: absolute;
        }
        .heart-button::before { top: -60px; left: 0; }
        .heart-button::after { left: 60px; top: 0; }

        @keyframes heart-beat {
            0%, 100% { transform: scale(1) rotate(-45deg); }
            50% { transform: scale(1.1) rotate(-45deg); }
        }
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

        #heart-nebula {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; height: 90%;
            background-image:
                radial-gradient(circle, rgba(255, 20, 147, 0.5) 0%, rgba(255, 20, 147, 0) 70%),
                radial-gradient(circle, rgba(255, 105, 180, 0.3) 0%, rgba(255, 105, 180, 0) 80%);
            clip-path: polygon(50% 0%, 100% 35%, 82% 100%, 50% 80%, 18% 100%, 0% 35%);
            filter: blur(20px); z-index: 1; opacity: 0.8;
        }

        .planet {
            position: absolute; border-radius: 50%; cursor: pointer; z-index: 10;
            border: 12px solid transparent; background-clip: padding-box; 
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.9);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .planet:hover {
            transform: scale(2); box-shadow: 0 0 15px rgba(255, 255, 255, 1);
        }

        .modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80%; max-width: 350px; background-color: #fff0f3; border-radius: 15px;
            padding: 25px; z-index: 100; text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8); color: #333;
        }
        .modal-content img {
            max-width: 150px; height: auto; margin-bottom: 15px; border-radius: 10px;
        }
        .modal-content p { font-size: 1.1em; margin: 0; color: #590d22; font-weight: 500; }
        .close-modal {
            position: absolute; top: 10px; right: 15px;
            font-size: 1.8em; cursor: pointer; color: #ff1493;
        }
        #modal-overlay {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background-color: rgba(0,0,0,0.7); z-index: 90;
        }
    </style>
</head>
<body>

    <!-- ESTRUCTURA HTML -->
    <div id="landing-screen">
        <h1>( para mi Casi todo )</h1>
        <p>Toca el corazón</p>
        <div class="heart-button" onclick="startGame()"></div>
    </div>

    <div id="galaxy-container">
        <div id="heart-nebula"></div>
        <div id="planets-layer"></div>
    </div>

    <div id="modal-overlay" onclick="closeModal()"></div>
    <div id="modal" class="modal">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <div class="modal-content">
            <!-- La imagen ahora cargará archivos locales .jpg -->
            <img id="display-image" src="" alt="Imagen dinámica">
            <p id="display-message"></p>
        </div>
    </div>

    <!-- SCRIPT JAVASCRIPT -->

            "Eres una persona amable cuyo trato hacia mí y hacia los demás siempre es cálido y bondadoso.",
            "Eres sumamente chévere y la persona con la que mejor la paso sin importar lo que estemos haciendo.",

            "Eres muy juiciosa y admiro la disciplina que tienes con tus metas y tus responsabilidades.",
            "Eres profundamente dedicada, demostrando un compromiso inquebrantable con lo que amas.",
            "Eres sumamente inteligente y me encanta cómo analizas las cosas y la lógica que aplicas a todo.",
            "Eres muy inteligente y posees una capacidad mental fascinante de la que siempre aprendo algo nuevo.",
            "Eres hermosa no solo físicamente, sino por la luz tan linda que irradias al caminar.",
            "Tus ojitos son el reflejo puro de tu alma y pierdo la noción del tiempo cada vez que me miras.",
            "Tu cabello es precioso y podría perderme en él todo el día, me encanta cómo se siente y cómo te queda.",
            "Eres muy ingeniosa y siempre tienes una salida divertida o una solución brillante para cualquier problema.",
            "Eres muy romántica y tienes la capacidad de hacer que lo cotidiano se vuelva completamente mágico.",
            "Tu sonrisa ilumina hasta mis días más oscuros.",
            "La forma en que te ríes de mis chistes, incluso cuando no son tan buenos.",
            "Cómo me miras cuando crees que no me doy cuenta.",
            "Lo comprensiva que eres conmigo, incluso en mis momentos difíciles.",
            "Tu valentía para plantarles cara a los problemas.",
            "Lo creativa que eres para darle color a la rutina.",
            "Tu hermosa voz, que es mi música favorita.",
            "Cómo te preocupas genuinamente por mi bienestar.",
            "La paz que me transmites cuando simplemente estamos juntos, sin decir nada.",
            "Tu autenticidad; no intentas ser nadie más que tú misma.",
            "Lo mucho que valoras los pequeños detalles que construyen nuestra historia.",
            "Tu bondad innata hacia las personas y los animales.",
            "Tu capacidad de escucharme siempre, con paciencia y atención.",
            "Lo bien que hueles siempre; es un aroma que ya asocio con estar en casa.",
            "Tu sentido del humor, que nos salva de cualquier tensión.",
            "La complicidad que tenemos, esa que solo tú y yo entendemos.",
            "Tu madurez para enfrentar las situaciones y no dejarte vencer.",
            "Lo apasionada que eres con las cosas que amas; esa energía es contagiosa.",
            "Cómo me apoyas en mis metas, incluso cuando yo dudo de mí mismo.",
            "Lo hermosa que te ves cuando estás distraída o concentrada.",
            "La luz que aportas a mi vida con cada pequeña acción.",
            "Lo bien que combinamos; somos un equipo imparable.",

            "La confianza que me ganaré día a día para cuidar de tu corazón.",
            "Tu estilo único al vestir; siempre te ves espectacular.",
            "Las pláticas largas en las que podemos hablar de todo y de nada.",

            "Lo tierna que te pones cuando tienes sueño; es un nivel de ternura nivel experto.",
            "Tu generosidad, siempre dispuesta a compartir lo que tienes.",
            "Lo bien que se siente tomar tu mano y saber que ahí es donde pertenezco.",
            "Cómo brillan tus ojos cuando hablas de lo que te apasiona.",
            "Tu independencia, que admiro tanto porque luchas por lo tuyo.",
            "Lo abrazable que eres; tus abrazos son mi refugio.",
            "La forma en que me haces sentir seguro, como si nada malo pudiera pasar.",
            "Tus ocurrencias repentinas que me hacen estallar de risa.",
            "Lo organizada que eres con tus cosas.",
            "Tu hermosa energía que llena toda la habitación.",
            "Cómo respetas y valoras a los demás, sin importar quiénes sean.",
            "Lo bien que nos divertimos haciendo cualquier tontería juntos.",
            "Tu nobleza de corazón, que es lo más puro que he conocido.",
            "La magia que irradias sin siquiera intentarlo.",
            "Lo increíblemente especial que eres para mí, mi persona favorita.",
            "Tu carisma único que hace que todos quieran estar cerca de ti.",

            "Lo valiente que eres al enfrentar tus propios miedos.",
            "Tu dulzura al hablarme, incluso cuando intentas ponerte seria.",
            "Cómo cuidas de los que amas con tanto esmero.",
            "Lo interesante que es aprender de ti y de tus experiencias.",
            "Tu sentido de la justicia y cómo siempre buscas hacer lo correcto.",
            "La paz mental que me da saber que te tengo en mi vida.",
            "Tu carita cuando te enojas y frunces el ceño de esa forma tan particular.",
            "Lo talentosa que eres para las cosas que te propones.",
            "Cómo disfrutas compartir una comida conmigo, haciendo que sepa mejor.",
            "Tu forma de moverte, siempre con gracia.",
            "Lo mucho que admiro tu determinación para no rendirte.",
            "Tus mensajes, que son lo primero que busco ver al despertar.",
            "Tu elegancia natural, que te hace destacar sin esfuerzo.",
            "Lo bien que entiendes mis locuras y las compartes conmigo.",
            "Tu capacidad para perdonar y elegir el camino de la paz.",
            "Cómo brillas con luz propia sin necesidad de nadie más.",
            "Tu lealtad inquebrantable, que valoro por encima de todo.",
            "Lo emocionante que es imaginar el futuro a tu lado.",
            "Tus abrazos, que tienen el poder de curar cualquier mal día.",
            "Tu frescura y espontaneidad al vivir.",
            "Lo mucho que crezco y aprendo gracias a ti.",
            "Tu hermosa manera de amar, que me hace sentir afortunado.",
            "Cómo haces que cualquier plan, por simple que sea, sea inolvidable.",
            "Tu optimismo, que me ayuda a ver el vaso medio lleno.",
            "Lo bien que encajas en mi vida, como si hubieras estado siempre aquí.",
            "Tus besos, que se sienten como llegar a casa después de un largo viaje.",
            "Lo orgulloso que estoy de la mujer en la que te has convertido.",
            "Que contigo nunca existen los momentos aburridos.",
            "Lo perfecta que eres para mí, con todas tus luces y tus días difíciles.",
            "Porque simplemente eres tú, y mi vida cambió para mejor desde que llegaste.",
            "Porque no cambiaría ni un segundo de lo que soy contigo; te amo con todo lo que eres, tal cual eres."
        ];

        function startGame() {
            document.getElementById('landing-screen').style.display = 'none';
            document.getElementById('galaxy-container').style.display = 'block';
            generatePlanets(); 
        }

        function generatePlanets() {
            const planetsLayer = document.getElementById('planets-layer');
            const numPlanets = rawStrings.length; 

            for (let i = 0; i < numPlanets; i++) {
                const planet = document.createElement('div');
                planet.classList.add('planet');
                
                planet.style.top = (Math.random() * 90 + 5) + '%';
                planet.style.left = (Math.random() * 90 + 5) + '%';
                
                const size = (Math.random() * 5 + 4) + 'px';
                planet.style.width = size;
                planet.style.height = size;

                const hue = Math.floor(Math.random() * 60) + 300; 
                planet.style.backgroundColor = `hsl(${hue}, 100%, 70%)`;
                
                planet.dataset.message = rawStrings[i];
                
                // AQUÍ ESTÁ LA MAGIA MATEMÁTICA: (i % 10) + 1 asegura que los números vayan del 1 al 10 repitiéndose.
                planet.dataset.imageIndex = (i % 10) + 1;
                
                planet.onclick = function() {
                    openModal(this.dataset.message, this.dataset.imageIndex);
                };

                planetsLayer.appendChild(planet);
            }
        }

        function openModal(message, imageIndex) {
            // El código ahora buscará archivos .jpg en lugar de URLs de internet
            document.getElementById('display-image').src = `snoopy-${imageIndex}.jpg`;
            document.getElementById('display-message').textContent = message;
            
            document.getElementById('modal').style.display = 'block';
            document.getElementById('modal-overlay').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('modal-overlay').style.display = 'none';
        }
    </script>
</body>
</html>
